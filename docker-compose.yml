services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-resume-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: aiuser
      POSTGRES_PASSWORD: aipass
      POSTGRES_DB: ai-resume
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiuser -d ai-resume"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
